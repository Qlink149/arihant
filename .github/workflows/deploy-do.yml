name: Deploy to DigitalOcean

on:
  push:
    branches: [prod]

concurrency:
  group: deploy-do-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_API_TOKEN }}
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE: registry.digitalocean.com/qlink01/fastapi-backend
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA}" backend/

          # DOCR occasionally fails mid-layer with "unknown: invalid content range"
          # after its own chunk retries. Re-push from a clean client attempt.
          push_with_retry() {
            local tag="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "Pushing ${tag} (attempt ${attempt}/5)..."
              if docker push "$tag"; then
                return 0
              fi
              echo "Push failed for ${tag}; waiting before retry..."
              sleep $((attempt * 15))
            done
            echo "Exhausted retries pushing ${tag}"
            return 1
          }

          push_with_retry "$IMAGE:${GITHUB_SHA}"
          push_with_retry "$IMAGE:latest"

      - name: Redeploy on Droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: /opt/arihant/redeploy.sh
