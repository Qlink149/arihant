name: Deploy to DigitalOcean

on:
  push:
    branches: [prod]

concurrency:
  group: deploy-do-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_API_TOKEN }}
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE: registry.digitalocean.com/qlink01/fastapi-backend
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA}" backend/
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Redeploy on Droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: /opt/arihant/redeploy.sh
