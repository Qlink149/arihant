name: Deploy to DigitalOcean

on:
  push:
    branches: [prod]

concurrency:
  group: deploy-do-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tune Docker for flaky DOCR uploads
        run: |
          # Concurrent chunked uploads often trigger DOCR "invalid content range".
          echo '{"max-concurrent-uploads":1,"max-concurrent-downloads":3}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_API_TOKEN }}
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE: registry.digitalocean.com/qlink01/fastapi-backend
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA}" backend/

          push_once() {
            local tag="$1"
            echo "Pushing ${tag}..."
            docker push "$tag"
          }

          # Two clean attempts only — avoid looking "stuck" on endless DOCR retries.
          if ! push_once "$IMAGE:${GITHUB_SHA}"; then
            echo "First SHA push failed; waiting 30s then retrying once..."
            sleep 30
            push_once "$IMAGE:${GITHUB_SHA}"
          fi
          if ! push_once "$IMAGE:latest"; then
            echo "First latest push failed; waiting 30s then retrying once..."
            sleep 30
            push_once "$IMAGE:latest"
          fi

      - name: Redeploy on Droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: /opt/arihant/redeploy.sh
